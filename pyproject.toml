[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "arthera-financial-service"
version = "0.1.0"
description = "Shared financial calculations, disclosure evidence and read-only MCP tools"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
market = ["yfinance>=0.2.55"]
alpaca = ["alpaca-py>=0.35.0"]
ibkr = ["ib_insync>=0.9.86"]
futu = ["futu-api>=9.1.5108"]
tiger = ["tigeropen>=3.2.0"]
longbridge = ["longbridge>=1.0.22"]
webull = ["webull>=0.3.14"]
trading212 = ["requests>=2.32.0"]
easytrader = ["easytrader>=0.23"]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
arthera-financial-service = "arthera_finance.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
